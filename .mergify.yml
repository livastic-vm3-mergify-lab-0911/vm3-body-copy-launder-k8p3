pull_request_rules:
  - name: vm3 k8p3 copy external source
    conditions:
      - author = livastic-vm3-secondary-20260911
      - title = VM3_BODY_COPY_SOURCE_K8P3
      - base = main
    actions:
      copy:
        branches:
          - release
  - name: vm3 k8p3 trusted generated approval merge
    conditions:
      - author = mergify[bot]
      - base = release
      - head ~= ^mergify/copy/release/pr-
      - "body ~= Security-Approval: YES"
    actions:
      merge:
        method: merge
