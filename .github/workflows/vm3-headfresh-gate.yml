name: VM3 Head Freshness Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  gate:
    name: vm3-headfresh-gate
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - name: Controlled speculative validation
        run: sleep 35
