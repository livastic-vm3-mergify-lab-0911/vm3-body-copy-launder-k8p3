name: VM3 K8P3 trusted release

on:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  trusted-release:
    name: vm3-k8p3-trusted-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute trusted release script
        env:
          K8P3_RELEASE_SECRET: ${{ secrets.K8P3_RELEASE_SECRET }}
        run: bash ci/k8p3-release.sh
